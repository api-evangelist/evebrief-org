apis:
- aid: evebrief-org:onchain-risk-oracle-a2a-agent
  name: onchain-risk-oracle A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card at https://oracle.evebrief.org/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 0.1.0, provider "openclaw / evm-lab") advertising
    one skill, onchain-risk-check — send an EVM address (optionally chain, deep, fork) and receive a structured
    risk verdict (none / low / high / critical) with labels, reasons, evidence and sources. The JSON-RPC
    endpoint is the host root, https://oracle.evebrief.org/; the card declares the x402 payment extension
    as REQUIRED (exact scheme, network xrpl:0, asset RLUSD, amount 0.01, facilitator xrpl-facilitator-mainnet.t54.ai)
    and both GET and POST on the endpoint return HTTP 402 with x402 v2 PaymentRequirements until paid.
    Streaming, push notifications and state-transition history are declared unsupported.
  humanURL: https://oracle.evebrief.org/.well-known/agent-card.json
  baseURL: https://oracle.evebrief.org/
