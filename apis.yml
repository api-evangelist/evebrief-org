aid: evebrief-org
name: openclaw / evm-lab
description: >-
  openclaw / evm-lab is the operator name on an A2A agent card served from oracle.evebrief.org, a subdomain of
  evebrief.org. The apex site is EveBrief, a waitlist-stage market and competitor intelligence briefing product
  for boutique agencies and independent consultants (indicative tiers Free / $19 / $39 a month; no API of its
  own). The oracle subdomain runs onchain-risk-oracle: a pay-per-task agent that checks an EVM address (eth,
  base, bsc, arb, op, polygon) against a curated rug-pull feed (114,110 records at probe time) and returns a
  none / low / high / critical risk verdict with labels, reasons and evidence. It is published as an A2A 0.3.0
  JSON-RPC agent at https://oracle.evebrief.org/ (agent card at /.well-known/agent-card.json and the legacy
  /.well-known/agent.json), gated by x402 v2 payment of 0.01 RLUSD on the XRP Ledger mainnet through the t54
  facilitator, and described by a FastAPI-generated OpenAPI 3.1.0 at /openapi.json with Swagger UI at /docs and
  ReDoc at /redoc. The card's provider.url credits the OpenClaw open-source agent framework
  (github.com/openclaw/openclaw); that organization is the software the agent runs on, not this operator.
