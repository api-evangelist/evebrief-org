apis:
- aid: evebrief-org:onchain-risk-oracle-api
  name: onchain-risk-oracle API
  description: >-
    The FastAPI-generated OpenAPI 3.1.0 contract (info.title onchain-risk-oracle, version 0.1.0) for the
    oracle host: five routes — GET /.well-known/agent.json and /.well-known/agent-card.json (the A2A card),
    GET /.well-known/x402 (the x402 v2 resource-server manifest), GET /healthz (status, payment_mode,
    feed_records, feed_latest_ts) and POST / (the JSON-RPC task endpoint). The contract declares no servers[],
    no securitySchemes, no request or response schemas and no 4xx responses; the real parameter contract is
    the skill inputSchema/outputSchema in the agent card. Every POST to / is a paid x402 task (0.01 RLUSD on
    XRPL) and answers HTTP 402 with PaymentRequirements until a PAYMENT-SIGNATURE header is supplied.
  humanURL: https://oracle.evebrief.org/docs
  baseURL: https://oracle.evebrief.org
  tags:
  - Agents
  - x402
  - EVM
  - Security
  - Risk
  properties:
  - type: OpenAPI
    url: openapi/evebrief-org-openapi.json
  - type: OpenAPI
    name: onchain-risk-oracle OpenAPI (provider-hosted)
    url: https://oracle.evebrief.org/openapi.json
  - type: Documentation
    url: https://oracle.evebrief.org/docs
  - type: APIReference
    url: https://oracle.evebrief.org/redoc
  - type: Overlay
    url: overlays/evebrief-org-openapi-overlay.yaml
- aid: evebrief-org:onchain-risk-oracle-a2a-agent
  name: onchain-risk-oracle A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card at https://oracle.evebrief.org/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 0.1.0, provider "openclaw / evm-lab") advertising one
    skill, onchain-risk-check — send an EVM address (optionally chain, deep, fork) and receive a structured
    risk verdict (none / low / high / critical) with labels, reasons, evidence and sources. The JSON-RPC
    endpoint is the host root, https://oracle.evebrief.org/; the card declares the x402 payment extension as
    REQUIRED (exact scheme, network xrpl:0, asset RLUSD, amount 0.01, facilitator
    xrpl-facilitator-mainnet.t54.ai) and both GET and POST on the endpoint return HTTP 402 with x402 v2
    PaymentRequirements until paid. Streaming, push notifications and state-transition history are declared
    unsupported.
  humanURL: https://oracle.evebrief.org/.well-known/agent-card.json
  baseURL: https://oracle.evebrief.org/
  tags:
  - A2A
  - agent-native
  - x402
  - XRPL
  properties:
  - type: AgentCard
    url: a2a/evebrief-org-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://oracle.evebrief.org/.well-known/agent-card.json
