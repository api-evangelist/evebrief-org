discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: oracle.evebrief.org
  note: >-
    Served from oracle.evebrief.org, a subdomain of the record's registrable domain evebrief.org, NOT from the
    apex: https://evebrief.org/.well-known/agent-card.json and /.well-known/agent.json both return a real
    Cloudflare Pages 404 (0 bytes). On the oracle host the canonical path and the legacy /.well-known/agent.json
    both answer 200 with byte-identical bodies (2,655 bytes; cmp reports no difference) — the FastAPI contract
    at /openapi.json declares both routes (operationIds agent_card__well_known_agent_json_get and
    agent_card_alt__well_known_agent_card_json_get). A negative-control path
    (/.well-known/apievangelist-negative-control-7f3a9c.json) returns the app's JSON 404 ({"detail":"Not
    Found"}, 22 bytes), so the 200s are served documents and not a catch-all. Ownership: the card's url is
    https://oracle.evebrief.org/, the x402 manifest on the same host names the same resource URL, the
    OpenAPI info.title is the card's name, both hosts resolve to the same Cloudflare addresses, and the
    certificate's SAN is evebrief.org + *.evebrief.org. The card's provider.url
    (https://github.com/openclaw/openclaw) points at the OpenClaw open-source assistant framework, which is
    a credit to the software the agent runs on, not a different owner of this host; the provider.organization
    string "openclaw / evm-lab" is the only operator name published anywhere on either host.
