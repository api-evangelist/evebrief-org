agent_card:
  name: onchain-risk-oracle
  description: >-
    (German) On-chain risk check for EVM addresses. Checks an address against a curated rug-pull feed (known
    rug tokens, their deployers, rug beneficiaries, funding sources and rug-factory hubs) and returns a
    structured risk verdict with evidence.
  description_language: de
  url: https://oracle.evebrief.org/
  version: 0.1.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  provider:
    organization: openclaw / evm-lab
    url: https://github.com/openclaw/openclaw
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
    extensions:
    - uri: https://x402.org/extensions/payment/v1
      description: Payment per task via x402 (HTTP 402).
      required: true
      params: {scheme: exact, network: 'xrpl:0', asset: RLUSD, amount: '0.01', payTo: rH2tcNh56xoLUssRubra7DSDCgrReSZodW, issuer: rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De, facilitator: 'https://xrpl-facilitator-mainnet.t54.ai', maxTimeoutSeconds: 600, resource: /, mode: xrpl}
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json]
  security_schemes: null
  security: null
  documentation_url: null
  icon_url: null
  skill_count: 1
  skills:
  - id: onchain-risk-check
    name: On-Chain-Risk-Check
    tags: [security, forensics, evm, rug-pull, risk, defi]
    input: 'address (required, ^0x[0-9a-fA-F]{40}$); chain (eth|base|bsc|arb|op|polygon, optional); deep (bool, live evm-lab heuristics, "more expensive/slower"); fork (bool, with deep: anvil-fork owner-privilege checks)'
    output: 'address, risk (none|low|high|critical), labels[], reasons[], evidence{}, live_tier{}, feed{}, sources[], disclaimer'
    examples:
    - 'Prüfe 0x0FB30397F744F9121C4902CBAed078AFAd9B8888 auf base'
    - '{"address": "0xb8c6ff50ea596671871784018a2030fe1852291a", "chain": "base"}'
  skill_invocation: >-
    One skill, invoked by sending the address (as JSON or plain text) to the JSON-RPC endpoint at the card's
    url; every task is a paid task under the required x402 extension (0.01 RLUSD on XRPL mainnet). The
    skill's inputSchema is the only parameter contract published anywhere — the OpenAPI's POST / declares
    no request body.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) carrying streaming,
    pushNotifications, stateTransitionHistory and an extensions[] array. protocolVersion is present at the top
    level (pass), declared "0.3.0". skills is an ARRAY (pass) of one fully-populated skill with id, name,
    description, tags, examples, inputModes and outputModes. All three optional discriminators are present:
    preferredTransport (JSONRPC), defaultInputModes (application/json, text/plain) and defaultOutputModes
    (application/json). A 0.3.0-shaped card (top-level url + preferredTransport + protocolVersion, no
    supportedInterfaces[]), internally consistent with the revision it declares.
  deviations:
  - field: protocolVersion / url / preferredTransport
    observed: 0.3.0 top-level triple; no supportedInterfaces[] or additionalInterfaces[]
    note: Valid for A2A 0.3.0, which the card declares. A reader written against A2A 1.0.0 looks for supportedInterfaces[].protocolBinding and will not find it. Recorded because both shapes coexist in the catalog, not as a fault.
  - field: securitySchemes / security
    observed: absent
    note: >-
      No authentication scheme is declared. Access control is economic: the only gate is the required x402
      payment extension, and a GET or POST to the card's url without a PAYMENT-SIGNATURE header returns 402.
      An agent reading securitySchemes learns nothing; it has to read capabilities.extensions[0].
  - field: capabilities.extensions[0].uri
    observed: https://x402.org/extensions/payment/v1 (HTTP 404 on fetch)
    note: >-
      The declared extension URI resolves to nothing, and it differs from the a2a-x402 extension URI other
      x402-paying cards in the catalog declare (https://github.com/google-a2a/a2a-x402/v0.1). The params block
      is self-describing enough to pay (scheme, network, asset, amount, payTo, issuer, facilitator), but an
      A2A client cannot dereference the extension to learn its semantics.
  - field: capabilities.extensions[0].params.network
    observed: 'xrpl:0 (XRP Ledger mainnet), asset RLUSD'
    note: Settlement is on the XRP Ledger while the skill analyses EVM chains (eth, base, bsc, arb, op, polygon). Not a fault; recorded because an EVM-native agent wallet cannot pay this card without an XRPL wallet and RLUSD.
  - field: skills[0].inputSchema / outputSchema
    observed: present
    note: Not fields of the A2A AgentSkill object; a provider extension. They are the most useful thing in the card — the only machine-readable parameter contract for the task — and are carried into the derived data model and the agent skill in this repo.
  - field: provider.url
    observed: https://github.com/openclaw/openclaw
    note: Points at the OpenClaw open-source assistant framework (openclaw.ai, 92 public repositories, 390k stars), not at a page about this operator. The operator's own web presence is the EveBrief site on the apex domain, which does not mention the oracle.
  - field: description / skill descriptions
    observed: German
    note: The apex site, the OpenAPI summaries and the x402 manifest description are English or mixed; the card prose is German. Recorded for agents that filter by language.
  - field: documentationUrl / iconUrl / signatures
    observed: absent
    note: No documentation link (Swagger UI at https://oracle.evebrief.org/docs and ReDoc at /redoc exist but are not referenced) and no JWS signature block, so the card's authenticity rests on TLS to oracle.evebrief.org.
  - field: url
    observed: https://oracle.evebrief.org/ (the host root)
    note: The JSON-RPC endpoint, the x402 resource and the card's url are the same URL, and a plain GET on it returns the 402 challenge rather than a JSON-RPC response — there is no unpaid method (no tasks/get on an unknown id, no agent/getAuthenticatedExtendedCard) to confirm the transport anonymously.
surface_relationship:
  note: >-
    One agent, one paid skill, one host. The A2A JSON-RPC endpoint (POST https://oracle.evebrief.org/) is the
    only functional operation; the OpenAPI at /openapi.json is the FastAPI-generated contract for the same
    app and lists five routes — the two card paths, the x402 manifest, /healthz and the JSON-RPC POST — with
    no request or response schemas. There is no MCP server, no GraphQL and no REST projection of the skill:
    an agent that cannot speak A2A + x402 on XRPL cannot use this service. See mcp/evebrief-org-mcp.yml for
    the derived (candidate, unshipped) MCP mapping and conformance/evebrief-org-conformance.yml for the
    protocol stack.
