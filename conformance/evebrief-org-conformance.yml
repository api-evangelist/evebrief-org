summary: >-
  The conformance profile is the agent-commerce protocol stack and nothing else: an A2A 0.3.0 agent card
  (graded conformant) declaring a REQUIRED x402 payment extension, x402 v2 observed live on the endpoint
  (HTTP 402 + PAYMENT-REQUIRED header + PaymentRequirements body on both GET and POST), an x402 resource-server
  manifest at /.well-known/x402, settlement in RLUSD on the XRP Ledger mainnet (CAIP-2 xrpl:0) through the
  t54 facilitator, and a FastAPI-generated OpenAPI 3.1.0 with five routes and no schemas. JSON-RPC 2.0 is
  declared (preferredTransport JSONRPC) but could not be observed because the 402 gate answers before the
  RPC layer. No OAuth/OIDC, no RFC 9457, no RFC 9116 security.txt, no RFC 9727 API catalog, no APIs.json,
  no RFC 8594 sunset signalling, no MCP, no GraphQL. No sector standard applies to a rug-pull risk oracle and
  none is invented.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  evidence: a2a/evebrief-org-agent-card.json — protocolVersion "0.3.0", url https://oracle.evebrief.org/, preferredTransport JSONRPC, capabilities object, skills[] of 1 with inputSchema/outputSchema; served at both /.well-known/agent-card.json and the legacy /.well-known/agent.json (byte-identical). Graded conformant in a2a/evebrief-org-a2a.yml.
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  evidence: >-
    GET and POST https://oracle.evebrief.org/ both returned HTTP 402 with a PAYMENT-REQUIRED response header
    (base64 JSON) and a JSON body {"x402Version":2,"resource":{...},"accepts":[{"scheme":"exact","network":"xrpl:0","amount":"0.01","asset":"524C555344000000000000000000000000000000","payTo":"rH2tcNh56xoLUssRubra7DSDCgrReSZodW","maxTimeoutSeconds":600,"extra":{"issuer":"rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De","sourceTag":804681468,"facilitator":{"id":"t54-xrpl","name":"t54 XRPL x402 facilitator"},"invoiceId":"..."}}],"error":"PAYMENT-SIGNATURE header is required"}
    with a fresh invoiceId per request; GET /.well-known/x402 returned a kind resource-server manifest naming
    the same resource, price and facilitator (well-known/evebrief-org-x402.json); GET /healthz reports
    payment_mode "xrpl".
  domain_standard_signature: true
  note: >-
    The x402 PaymentRequirements payload — the machine-readable price contract — was observed directly on the
    endpoint, which is stronger than a prose claim. This is the contract-level signature for agent commerce
    that this market has. No payment was made.
- id: a2a-x402-payment-extension
  name: A2A x402 payment extension (as declared)
  conforms: true
  verification: declared
  evidence: a2a/evebrief-org-agent-card.json capabilities.extensions[0] — uri https://x402.org/extensions/payment/v1, required true, params {scheme exact, network xrpl:0, asset RLUSD, amount 0.01, payTo, issuer, facilitator, maxTimeoutSeconds 600, resource /, mode xrpl}.
  gaps:
  - The declared extension URI returns HTTP 404 (x402.org HTML 404 page) — the extension cannot be dereferenced.
  - The URI differs from the a2a-x402 extension other x402-paying cards declare (https://github.com/google-a2a/a2a-x402/v0.1), so a client keyed on that URI will not recognise this card as x402-payable.
